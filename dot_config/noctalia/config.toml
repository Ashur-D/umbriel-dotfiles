[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.0
    capsule = true
    capsule_opacity = 0.59999998658895493
    capsule_padding = 18.0
    capsule_thickness = 0.99999998137354851
    center = [ "workspaces" ]
    end = [ "group:g1" ]
    font_family = "Maple Mono"
    margin_edge = 5
    margin_ends = 5
    padding = 0
    start = [ "group:g2" ]
    thickness = 37

        [bar.main.dead_zone.actions]
        left = "wallpaper-next"

        [[bar.main.capsule_group]]
        accordion = true
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        foreground = "secondary"
        id = "g1"
        members = [ "media", "tray" ]
        opacity = 0.59999996423721313
        padding = 18.0

        [[bar.main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = ""
        enabled = true
        fill = "surface_variant"
        foreground = "secondary"
        id = "g2"
        members = [ "clock", "recorder" ]
        opacity = 0.59999996423721313
        padding = 18.0

[control_center]
show_shortcut_labels = false

    [[control_center.shortcuts]]
    type = "session"

    [[control_center.shortcuts]]
    type = "clipboard"

    [[control_center.shortcuts]]
    type = "wallpaper"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "weather"

    [[control_center.shortcuts]]
    type = "caffeine"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

