[osd]
offset_y = 80
position = "bottom_center"

[plugin_settings."noctalia/screen_recorder"]
color_range = "full"
hide_inactive = true
video_source = "focused"

[plugins]
enabled = [ "noctalia/screen_recorder", "cleboost/zed-provider" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
avatar_path = "/home/ash/Downloads/3c223a02d512059985adac41c0c30380.jpg"
font_family = "Maple Mono"
settings_window_translucent = true

    [shell.launcher]
    categories = false

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "top_center"
    session_placement = "floating"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.screenshot]
    pipe_command = "satty -f - --early-exit --copy-command wl-copy"
    pipe_to_command = true

    [shell.session]
    show_shortcuts = false

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "kitty", "starship", "umbriel" ]
    community_ids = [ "antigravity", "opencode", "discord", "neovim", "obsidian", "zed", "steam", "yazi" ]

[wallpaper]
directory = "/home/ash/dotfiles/media/wallpapers"
directory_dark = "/home/ash/dotfiles/media/wallpapers"
directory_light = "/home/ash/dotfiles/media/wallpapers"
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/ash/dotfiles/media/wallpapers/wallpaper87.png"

    [wallpaper.last]
    path = "/home/ash/dotfiles/media/wallpapers/wallpaper87.png"

    [wallpaper.monitors.DP-1]
    path = "/home/ash/dotfiles/media/wallpapers/wallpaper87.png"

[widget.clock]
color = "secondary"
format = "{:L%A %I:%M}"
icon_color = "secondary"
interactive = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.tray]
drawer = true
hide_passive = false
match_adjacent_spacing = true

[widget.workspaces]
show_labels = false

    [widget.workspaces.actions]
    right = "wallpaper-random"
