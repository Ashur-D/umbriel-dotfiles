# Umbriel default config
# Copy this file to ~/.config/umbriel/config.toml to customize it.
# Changes apply on save. See docs/user/ for the full reference.
#
# [include] merges extra files into this one. Included files are parsed first,
# in list order (later files override earlier ones), then everything in this
# file overrides all of them. That is why Noctalia's dynamic theming can render
# its palette into a separate noctalia.toml and still let you override the
# generated colors here.

[include]
files = [
  "general.toml",
  "appearance.toml",
  "input.toml",
  "keybinds.toml",
  "rules.toml",
  "workspaces.toml",
  # --------------------------------------------------------------------------
  # Animation Profiles (Uncomment the one you want to try!)
  # --------------------------------------------------------------------------
  "animations/original.toml",      # Your original configuration (Currently Active)
  # "animations/snappy.toml",      # Fast, modern, energetic (Hyprland feel)
  # "animations/spring.toml",      # Apple/macOS spring physics momentum
  # "animations/bouncy.toml",      # Playful rubber-band elasticity
  # "animations/minimal.toml",     # 120ms competitive speedrun
  # "animations/gentle.toml",      # Luxurious, cinematic slow glide (500ms)
  # "animations/expressive.toml",  # Material You / Android 14 motion
  # "animations/glide.toml",       # Horizontal momentum slide,
  "noctalia.toml",
]
