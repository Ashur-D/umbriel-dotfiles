# Umbriel general settings
# Includes converted values from Hyprland config

[general]
autostart = [
  "noctalia",
  "dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE",
  "systemctl --user start hyprpolkitagent",
]
mod_key = "Alt"            # Mod in keybinds; defaults to Super (Alt when nested)
xwayland = true
show_cheatsheet = true
focus_on_activate = false         # overridden: Hyprland had focus_on_activate = true
honor_restored_maximize = false

[environment]
XCURSOR_SIZE = "24"
XCURSOR_THEME = "Bibata-Modern-Classic"
GDK_BACKEND = "wayland,x11,*"
GDK_SCALE = "1"
SDL_VIDEODRIVER = "wayland"
MOZ_ENABLE_WAYLAND = "1"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
OZONE_PLATFORM = "wayland"
