# ============================================================================
# ANIMATION PRESET: Snappy (Modern Tiling / Hyprland Feel)
# Vibe: Fast (220-260ms), highly responsive, energetic pop
# ============================================================================

[animation.beziers]
fluid     = [0.16, 1.0, 0.3, 1.0]
overshoot = [0.05, 1.15, 0.2, 1.0]
liner     = [1.0, 1.0, 1.0, 1.0]

[animation]
enabled = true
duration_ms = 240
curve = "fluid"

[animation.windows_in]
enabled = true
duration_ms = 220
curve = "overshoot"
style = "popin"
scale = 0.85

[animation.windows_out]
enabled = true
duration_ms = 180
curve = "fluid"
style = "fade"

[animation.windows_move]
enabled = true
duration_ms = 240
curve = "fluid"

[animation.workspaces]
enabled = true
duration_ms = 240
curve = "fluid"

[animation.overview]
enabled = true
duration_ms = 220
curve = "fluid"

[animation.scratchpad]
enabled = true
duration_ms = 240
curve = "overshoot"
dim = 0.35
scale = 0.85

[animation.border]
enabled = true
duration_ms = 200
curve = "liner"
