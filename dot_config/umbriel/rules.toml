# Umbriel window and layer rules
# Converted from Hyprland config

# Default opacity for all windows
[[window_rule]]
match.app_id = ".*"
opacity = 0.97

# Float Steam
[[window_rule]]
match.app_id = "^steam$"
default_floating = true

[[window_rule]]
match.app_id = "^steam$"
match.title = "^Steam$"
default_floating = true
default_size = [1100, 700]
default_position = { x = 0, y = 0, anchor = "center" }

[[window_rule]]
match.app_id = "^steam.*$"
opacity = 1.0

[[window_rule]]
match.app_id = "^steam$"
match.title = "^Friends List$"
default_size = [460, 800]

# Satty
[[window_rule]]
match.app_id = "^com.gabm.satty$"
default_floating = true
default_position = { x = 0, y = 0, anchor = "center" }
default_pinned = true
default_size = [460, 800]

# File dialogs / Save / Open
[[window_rule]]
match.title = "^(Open File|Select|Choose a wallpaper|Open Folder|Save As|Library|Choose Where to Download|File Operation Progress|Rename|Copy Files|Move Files|Search Files)$"
default_floating = true

# Discord / Vesktop
[[window_rule]]
match.app_id = "^(vesktop|discord)$"
opacity = 1.0

# Layer rules (Noctalia layer surfaces)
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"+]|notification|dock|panel|attached-panel|osd|window-switcher)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

# Floating rules for interactive installer/uninstaller popups (Overlay & Pinned)
[[window_rule]]
match.title = "^(Install Optional Apps|Uninstall Packages)$"
default_floating = true
default_pinned = true
default_size = [980, 680]
default_position = { x = 0, y = 0, anchor = "center" }
