# Animation ------------------------------------------------------------------

[animation.beziers]
wind   = [0.05, 0.9, 0.1, 1.05]
winIn  = [0.1, 1.1, 0.1, 1.1]
winOut = [0.3, -0.3, 0.0, 1.0]
liner  = [1.0, 1.0, 1.0, 1.0]

[animation]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.windows_in]
enabled = true
duration_ms = 600
curve = "winOut"
style = "popin"

[animation.windows_out]
enabled = true
duration_ms = 600
curve = "winOut"
style = "slide"

[animation.windows_move]
enabled = true
duration_ms = 600
curve = "wind"

[animation.workspaces]
enabled = true
duration_ms = 600
curve = "wind"

[animation.overview]
enabled = true
duration_ms = 600
curve = "easeout"

[animation.scratchpad]
enabled = true
duration_ms = 600
curve = "wind"
dim = 0.3
scale = 0.0
maximize = false
fullscreen = false

[animation.border]
enabled = true
duration_ms = 600
curve = "liner"

[animation.dim_unfocused]
enabled = false
duration_ms = 600
curve = "easeout"
dim = 0.0

# Appearance -----------------------------------------------------------------

[appearance]
prefer_no_csd = true
border_width = 3
outer_border_width = 0
corner_radius = 16
drag_opacity = 0.75

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 2
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = false
softness = 2
offset_x = 0
offset_y = 0
