# Template data: the single place that says what gets installed and enabled.
#
# A module is a bundle of:
#   packages  installed by .chezmoiscripts/10-packages
#   services  enabled by   .chezmoiscripts/20-system   (optional)
#
# `core` is always on. Everything else is chosen at `chezmoi init`
# (stored as `enabled` in ~/.config/chezmoi/chezmoi.toml).
#
# Add a module:    add a [modules.<name>] block here.
# Remove a module: delete its block. No script needs editing.

# Baseline defaults (used when ~/.config/chezmoi/chezmoi.toml does not define them)
enabled = ["core"]
hasNvidia = false

# ----------------------------------------------------------------------------
# Always on
# ----------------------------------------------------------------------------
[modules.core]
packages = [
    # Compositor & Desktop Shell
    "xwayland-satellite",
    "umbriel-git",
    "noctalia",

    # Terminal, Shell & Tools
    "kitty",
    "starship",
    "fastfetch",
    "yazi",
    "neovim",
    "chezmoi",
    "xdg-user-dirs",

    # Audio & Power
    "pipewire",
    "pipewire-pulse",
    "wireplumber",
    "power-profiles-daemon",
    "python-gobject", # needed for power-profiles

    # Networking & Bluetooth
    "networkmanager", # Ethernet + Wi-Fi (pulls in wpa_supplicant) or use iwd
    "bluez",

    # Capture, Fonts & GTK
    "wl-clipboard",
    "gpu-screen-recorder",
    "bibata-cursor-theme-bin", # cursor
    "maplemono-ttf",           # main font
    "noto-fonts-emoji",        # or ttf-apple-emoji
    "noto-fonts",
    "adw-gtk-theme",

    # Security, Keyring & Memory
    "oo7",
    "libsecret",
]
services = [
    "NetworkManager.service",
    "bluetooth.service",
    "power-profiles-daemon.service",
]

# Added automatically when an NVIDIA GPU is detected at `chezmoi init`.
[nvidia]
packages = [
    "nvidia-open-dkms",
    "nvidia-utils",
    "egl-wayland",
    "libva-nvidia-driver",
]
# Only installed when [multilib] is enabled in /etc/pacman.conf.
multilib_packages = [
    "lib32-nvidia-utils",
]

# ----------------------------------------------------------------------------
# Optional modules (selected at chezmoi init)
# ----------------------------------------------------------------------------
[modules.desktop]
packages = [
    "helium-browser-bin",
    "discord",
    "obsidian",
    "localsend",
    "spotifast-bin",
]

[modules.gaming]
packages = [
    "steam",
    "proton-cachyos-slr",
]

[modules.dev]
packages = [
    "zed",
    "lazygit",
    "git",
    "openssh",
    "winboat",
]

[modules.cli]
packages = [
    "eza",
    "zoxide",
    "fzf",
    "fd",
    "ripgrep",
    "7zip",
]
[modules.system]
packages = [
    "btop",
    "systemctl-tui",
    "systemd-manager-tui",
    "netsonar-bin",
    "gdu",
    "efibootmgr",
    "lact-git",
]

[modules.media]
packages = ["mpv", "imv", "stremio"]

[modules.rice]
packages = [
    "catnap-git",
    "weathr",
    "rustormy-bin",
    "cbonsai",
    "terminal-rain-lightning",
    "scope-tui",
    "astroterm",
    "asciinema",
]

# ----------------------------------------------------------------------------
# Launcher overrides
# ----------------------------------------------------------------------------
[launcher]
# Utility apps hidden from the application launcher.
hidden_apps = [
    "bssh",
    "bvnc",
    "avahi-discover",
    "rofi-theme-selector",
    "thunar-bulk-rename",
    "thunar-settings",
    "wiremix",
    "cmake-gui",
    "org.gnupg.pinentry-qt",
    "xdg-desktop-portal-gdk",
    "xgps",
    "xgpsspeed",
    "qv4l2",
    "qvidcap",
    "lstopo",
]
