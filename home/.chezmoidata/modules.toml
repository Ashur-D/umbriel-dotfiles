# Template data: the single place that says what gets installed and enabled.
#
# A module is a bundle of:
#   packages  installed by .chezmoiscripts/10-packages
#   services  enabled by   .chezmoiscripts/20-system   (optional)
#   config    target path of its config, skipped when the module is off (optional)
#
# `core` is always on. Everything else is chosen at `chezmoi init`
# (stored as `enabled` in ~/.config/chezmoi/chezmoi.toml).
#
# Add an app:    add a [modules.<name>] block here, plus its dot_config/<name>/ folder.
# Remove an app: delete both. No script or ignore file needs editing.

# Utility apps hidden from the application launcher.
hidden_apps = [
    "bssh",
    "bvnc",
    "avahi-discover",
    "rofi-theme-selector",
    "thunar-bulk-rename",
    "thunar-settings",
    "wiremix",
    "cmake-gui",
    "org.gnupg.pinentry-qt",
    "xdg-desktop-portal-gdk",
    "xgps",
    "xgpsspeed",
    "qv4l2",
    "qvidcap",
    "lstopo",
]

# Added automatically when an NVIDIA GPU is detected at `chezmoi init`.
[nvidia]
packages = [
    "nvidia-dkms",
    "nvidia-utils",
    "egl-wayland",
    "libva-nvidia-driver",
]
# Only installed when [multilib] is enabled in /etc/pacman.conf.
multilib_packages = [
    "lib32-nvidia-utils",
]

# ----------------------------------------------------------------------------
# Always on
# ----------------------------------------------------------------------------
[modules.core]
packages = [
    # Compositor & Desktop Shell
    "xwayland-satellite",
    "umbriel-git",
    "noctalia",

    # Terminal, Shell & Tools
    "kitty",
    "starship",
    "chezmoi",
    "xdg-user-dirs",

    # Audio & Power
    "pipewire",
    "pipewire-pulse",
    "wireplumber",
    "playerctl",
    "power-profiles-daemon",
    "python-gobject", # needed for power-profiles

    # Networking & Bluetooth
    "networkmanager", # Ethernet + Wi-Fi (pulls in wpa_supplicant)
    "bluez",

    # Capture, Fonts & GTK
    "wl-clipboard",
    "gpu-screen-recorder",
    "bibata-cursor-theme-bin", # cursor
    "maplemono-ttf",           # main font
    "noto-fonts-emoji",        # or ttf-apple-emoji
    "noto-fonts",
    "adw-gtk-theme",
]
services = [
    "NetworkManager.service",
    "bluetooth.service",
    "power-profiles-daemon.service",
]

# ----------------------------------------------------------------------------
# Modules that own a config folder
# ----------------------------------------------------------------------------
[modules.nvim]
config = ".config/nvim"
packages = ["neovim", "ripgrep", "fd"]

[modules.yazi]
config = ".config/yazi"
packages = ["yazi", "7zip", "fd", "ripgrep", "fzf"]

[modules.zed]
config = ".config/zed"
packages = ["zed"]

[modules.fastfetch]
config = ".config/fastfetch"
packages = ["fastfetch"]

# ----------------------------------------------------------------------------
# Package-only modules
# ----------------------------------------------------------------------------
[modules.cli]
packages = ["eza", "zoxide", "fzf", "fd", "ripgrep", "7zip"]

[modules.dev]
packages = ["lazygit", "git", "openssh", "winboat"]

[modules.desktop]
packages = [
    "helium-browser-bin",
    "discord",
    "obsidian",
    "localsend",
    "fastpotify-bin",
]

[modules.gaming]
packages = ["steam", "proton-cachyos"]

[modules.system]
packages = [
    "btop",
    "systemctl-tui",
    "systemd-manager-tui",
    "netsonar-bin",
    "gdu",
    "efibootmgr",
    "lact-git",
]

[modules.media]
packages = ["mpv", "imv", "stremio"]

[modules.rice]
packages = [
    "catnap-git",
    "weathr",
    "stormy-bin",
    "cbonsai",
    "terminal-rain-lightning-git",
    "scope-tui",
    "astroterm",
    "asciinema",
]
