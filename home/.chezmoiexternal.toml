# Externals: chezmoi clones/updates these itself, replacing the hand-written
# clone / mv / pull logic in install/03-dotfiles.sh.
#
# The wallpapers repo contains a `wallpapers/` subfolder, so images end up in
# ~/Pictures/wallpapers/wallpapers/ (matching the Noctalia `avatar_path`).
# `chezmoi apply` refreshes it at most once a week; `chezmoi apply --refresh-externals`
# forces an update.
["Pictures/wallpapers"]
    type = "git-repo"
    url = "https://github.com/Ashur-D/wallpapers.git"
    refreshPeriod = "168h"

    ["Pictures/wallpapers".clone]
        args = ["--depth", "1"]

    ["Pictures/wallpapers".pull]
        args = ["--ff-only"]
