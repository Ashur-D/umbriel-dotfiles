# Font
font_family MapleMono
bold_italic_font auto
font_size        14.0
background_opacity 0.75
cursor_trail 1

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Allow remote access
allow_remote_control no

# Aesthetics
scrollbar never
cursor_shape block
enable_audio_bell no
# Space Background Shaders (uncomment one, then press Ctrl+Shift+F5)
custom_shaders space-deluxe
# custom_shaders space
# custom_shaders original
# custom_shaders space-colors
# custom_shaders space-lens
# custom_shaders space-nebula
# custom_shaders space-meteors
# custom_shaders space-drift

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
include themes/noctalia.conf
