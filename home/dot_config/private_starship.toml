palette = "noctalia"
add_newline = false

format = """
[](yellow)\
$os\
$username\
[](bg:blue fg:yellow)\
$directory\
${custom.git_start}\
${custom.git_branch}\
${custom.git_end}\
${custom.nongit}\
[ 󰭟 ](bg:green fg:black)\
[ ](fg:green)\
$line_break\
$character"""

[username]
show_always = true
style_user = "bg:yellow fg:black bold"
style_root = "bg:red fg:black bold"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:yellow fg:black"
disabled = true

[directory]
style = "bg:blue fg:black bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[custom.nongit]
when = "! git rev-parse --is-inside-work-tree 2>/dev/null"
command = "echo -n ''"
format = "[](fg:blue bg:green)"

[custom.git_start]
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
command = "echo -n ''"
format = "[](fg:blue bg:cyan)"

[custom.git_branch]
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
command = "branch=$(git branch --show-current 2>/dev/null || git rev-parse --short HEAD 2>/dev/null); status=$(git status --porcelain 2>/dev/null); [ -n \"$status\" ] && echo -n \" $branch !\" || echo -n \" $branch\""
format = "[ $output ](bg:cyan fg:black bold)"

[custom.git_end]
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
command = "echo -n ''"
format = "[](fg:cyan bg:green)"

[character]
disabled = false
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold magenta)"

