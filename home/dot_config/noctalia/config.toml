[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.0
    capsule = true
    capsule_opacity = 0.6
    capsule_padding = 18.0
    capsule_thickness = 1.0
    center = [ "workspaces" ]
    end = [ "group:g1" ]
    font_family = "Maple Mono"
    margin_edge = 5
    margin_ends = 5
    padding = 0
    show_tooltip = false
    start = [ "group:g2" ]
    thickness = 37

        [[bar.main.capsule_group]]
        accordion = true
        fill = "surface_container"
        foreground = "secondary"
        id = "g1"
        members = [ "media", "tray" ]
        opacity = 0.6
        padding = 18.0

        [[bar.main.capsule_group]]
        fill = "surface_container"
        foreground = "secondary"
        id = "g2"
        members = [ "clock", "recorder" ]
        opacity = 0.6
        padding = 18.0

[control_center]
show_shortcut_labels = false

    [[control_center.shortcuts]]
    type = "session"

    [[control_center.shortcuts]]
    type = "clipboard"

    [[control_center.shortcuts]]
    type = "wallpaper"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "weather"

    [[control_center.shortcuts]]
    type = "caffeine"

[idle]
behavior_order = [ "lock" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 799.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "primary"
        background_opacity = 0.33
        background_radius = 32.0
        center_password_text = true
        input_opacity = 0.93
        input_radius = 32.0
        layout = "compact"
        show_caps_lock = false
        show_keyboard_layout = false
        show_login_button = false
        show_media = false
        show_password_reveal = false
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 240.0
    box_width = 512.0
    cx = 960.0
    cy = 356.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "primary"
        font_family = "Maple Mono"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 64.0
    box_width = 400.0
    cx = 960.0
    cy = 236.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        color = "primary"
        format = "%A, %B %d"
        shadow = false

[notification]
border_color = "primary"
border_width = 3.0

[osd]
offset_y = 80
position = "bottom_center"

[plugin_settings."ashur-d/wallpaper-widget"]
close_on_apply = true
notify_on_change = false

[plugin_settings."cleboost/zed-provider"]
new_window = true

[plugin_settings."noctalia/screen_recorder"]
color_range = "full"
hide_inactive = true

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "cleboost/zed-provider",
    "ashur-d/nvim-projects",
    "ashur-d/wallpaper-widget"
]

[shell]
font_family = "Maple Mono"
settings_expand_all_groups = true
settings_window_translucent = true

    [shell.launcher]
    categories = false
    fetch_exchange_rates = false
    layout = "simple"

        [shell.launcher.providers.calculator]
        global = false

    [shell.mpris]
    blacklist = [ "helium" ]

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.screenshot]
    annotate = true

    [shell.session]
    show_shortcuts = false

[theme]
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kitty", "umbriel" ]
    community_ids = [ "pi-agent", "spotifast", "zed", "fastfetch", "yazi", "starship" ]

[wallpaper]
directory = "~/Pictures/wallpapers"

    [wallpaper.default]
    path = "~/Pictures/wallpapers/Mystical Forest Waterfall at Night.jpeg"

[widget.clock]
format = "{:L%A %I:%M}"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.tray]
detached_panel = true
drawer = true

[widget.workspaces]
show_labels = false

    [widget.workspaces.actions]
    right = "wallpaper-random"
