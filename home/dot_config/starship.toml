palette = "noctalia"

format = """
[](peach)\
$os\
$username\
[](bg:maroon fg:peach)\
$directory\
${custom.git_start}\
${custom.git_branch}\
${custom.git_end}\
${custom.nongit}\
[ 󰭹 ](bg:mauve fg:crust)\
[ ](fg:mauve)\
$line_break\
$character"""

[username]
show_always = true
style_user = "bg:peach fg:crust bold"
style_root = "bg:peach fg:crust bold"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:peach fg:crust"
disabled = true

[directory]
style = "bg:maroon fg:crust bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[custom.nongit]
when = "! git rev-parse --is-inside-work-tree 2>/dev/null"
command = "echo -n ''"
format = "[](fg:maroon bg:mauve)"

[custom.git_start]
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
command = "echo -n ''"
format = "[](fg:maroon bg:teal)"

[custom.git_branch]
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
command = "branch=$(git branch --show-current 2>/dev/null || git rev-parse --short HEAD 2>/dev/null); status=$(git status --porcelain 2>/dev/null); [ -n \"$status\" ] && echo -n \" $branch !\" || echo -n \" $branch\""
format = "[ $output ](bg:teal fg:crust bold)"

[custom.git_end]
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
command = "echo -n ''"
format = "[](fg:teal bg:mauve)"

[character]
disabled = false
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

