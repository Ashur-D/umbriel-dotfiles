# ----------------------------------------------------------------------------
# Window rules
# Matching rules combine; for the same field, the later rule wins.
# Windows default to fully opaque, so only opt in below.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Blur only
# Apps that are already transparent themselves (kitty background_opacity,
# Zed blur theme). Compositor opacity would fade the text too.
# ----------------------------------------------------------------------------
[[window_rule]]
match.app_id = [
    '^kitty$',
    '^dev\.zed\.Zed$',
]
blur = true
blur_optimized = true

# ----------------------------------------------------------------------------
# Opacity + blur
# Apps with no native transparency option.
# ----------------------------------------------------------------------------
[[window_rule]]
match.app_id = [
    '^discord$',
]
opacity = 0.92
blur = true
blur_optimized = true

# ----------------------------------------------------------------------------
# Per-app overrides
# ----------------------------------------------------------------------------
[[window_rule]]
match.app_id = '^zeron.*$'
opacity = 0.80
blur = true
blur_optimized = true
default_floating = true


# ----------------------------------------------------------------------------
# Steam Rules
# ----------------------------------------------------------------------------
# All Steam windows: always floating and 100% opaque (no blur/transparency artifacts)
[[window_rule]]
match.app_id = "^steam.*$"
default_floating = true
opacity = 1.0

# Main Steam client window size & placement
[[window_rule]]
match.app_id = "^steam$"
match.title = "^Steam$"
default_floating_size_px = { width = 1100, height = 700 }
default_position = { x = 0, y = 0, anchor = "center" }

# Steam Friends list size
[[window_rule]]
match.app_id = "^steam$"
match.title = "^Friends List$"
default_floating_size_px = { width = 460, height = 800 }

# ----------------------------------------------------------------------------
# Dialogs & Utilities
# ----------------------------------------------------------------------------
# File pickers & transfer dialogs
[[window_rule]]
match.title = "^(Open File|Select|Choose a wallpaper|Open Folder|Save As|Library|Choose Where to Download|File Operation Progress|Rename|Copy Files|Move Files|Search Files)$"
default_floating = true

# ----------------------------------------------------------------------------
# Desktop Shell (Noctalia)
# ----------------------------------------------------------------------------
# Blur all Noctalia bars, panels, notifications, and popups
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

# Noctalia Settings window: always float and center
[[window_rule]]
match.app_id = "^dev\\.noctalia\\.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1280, height = 920 }
default_position = { x = 0, y = 0, anchor = "center" }
