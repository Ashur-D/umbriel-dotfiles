[workspaces]
back_and_forth = true
empty_above = false

# ----------------------------------------------------------------------------
# Outputs
# ----------------------------------------------------------------------------
# Primary desktop monitor (180Hz)
[output.DP-1]
mode = "1920x1080@180"
position = [0, 0]
scale = 1
min_workspaces = 3
workspace_axis = "horizontal"

# Virtual Machines (QEMU/KVM, GNOME Boxes)
[output.Virtual-1]
scale = 1
min_workspaces = 3
workspace_axis = "horizontal"

# Laptops
[output.eDP-1]
scale = 1
min_workspaces = 3
workspace_axis = "horizontal"

# HDMI displays
[output.HDMI-A-1]
scale = 1
min_workspaces = 3
workspace_axis = "horizontal"
[layout]
mode = "dwindle"
gap = 5

[layout.dwindle]
preserve_split = true

[layout.scrolling]
default_extent_fraction = 0.5

[layout.master]
position = "left"
default_width_fraction = 0.55
new_on_top = true

[overview]
zoom = 0.5
background_blur = false
shortcuts = false

[hot_corners.top_left]
enabled = true
delay_ms = 200
action = "overview-open"
