# ============================================================================
# ANIMATION PRESET: Expressive (Material You / Android 14 Motion)
# Vibe: Dynamic deceleration, natural curve shaping
# ============================================================================

[animation.beziers]
emphasizedDecel = [0.05, 0.7, 0.1, 1.0]
emphasizedAccel = [0.3, 0.0, 0.8, 0.15]

[animation]
enabled = true
duration_ms = 400
curve = "emphasizedDecel"

[animation.windows_in]
enabled = true
duration_ms = 420
curve = "emphasizedDecel"
style = "popin"
scale = 0.88

[animation.windows_out]
enabled = true
duration_ms = 220
curve = "emphasizedAccel"
style = "fade"

[animation.windows_move]
enabled = true
duration_ms = 420
curve = "emphasizedDecel"

[animation.workspaces]
enabled = true
duration_ms = 400
curve = "emphasizedDecel"

[animation.overview]
enabled = true
duration_ms = 350
curve = "emphasizedDecel"

[animation.scratchpad]
enabled = true
duration_ms = 380
curve = "emphasizedDecel"
dim = 0.3
scale = 0.9
