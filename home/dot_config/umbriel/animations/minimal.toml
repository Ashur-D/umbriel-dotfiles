# ============================================================================
# ANIMATION PRESET: Minimal (Speedrun / Competitive 120ms)
# Vibe: Instantaneous, zero latency, ultra-clean fades
# ============================================================================

[animation.beziers]
fastEase = [0.25, 0.1, 0.25, 1.0]

[animation]
enabled = true
duration_ms = 120
curve = "fastEase"

[animation.windows_in]
enabled = true
duration_ms = 110
curve = "fastEase"
style = "fade"

[animation.windows_out]
enabled = true
duration_ms = 100
curve = "fastEase"
style = "fade"

[animation.windows_move]
enabled = true
duration_ms = 120
curve = "fastEase"

[animation.workspaces]
enabled = true
duration_ms = 120
curve = "fastEase"

[animation.overview]
enabled = true
duration_ms = 110
curve = "fastEase"

[animation.scratchpad]
enabled = true
duration_ms = 120
curve = "fastEase"
dim = 0.25
