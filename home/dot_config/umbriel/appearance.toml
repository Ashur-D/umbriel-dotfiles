# ============================================================================
# Appearance & Visual Effects
# ============================================================================

[appearance]
prefer_no_csd = true
border_width = 0
outer_border_width = 0
corner_radius = 16
drag_opacity = 0.75

[appearance.blur]
enabled = true
optimized = true
passes = 1
radius = 6
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.5
